name: Build & Publish Images (GHCR)

# main'e her push'ta tüm image'ları build edip GitHub Container Registry'ye (ghcr.io) atar.
# Image isimleri: ghcr.io/<owner>/goa-<servis>
#
# Beklenen secret'lar (Settings > Secrets and variables > Actions):
#   GHCR_USERNAME  (opsiyonel) ghcr.io kullanıcı adı. Tanımlı değilse workflow'u tetikleyen kullanıcı (github.actor) kullanılır.
#   GHCR_TOKEN     (opsiyonel) write:packages yetkili Personal Access Token. Tanımlı değilse yerleşik GITHUB_TOKEN kullanılır.
#
# Auto deploy için (deploy job'u eklendiğinde) beklenenler:
#   SSH_HOST, SSH_USER, SSH_KEY (private key), opsiyonel SSH_PORT

on:
  push:
    branches:
      - main
  workflow_dispatch: # Manuel tetikleme

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Backend (backend/Dockerfile, multi-stage target'lar) ---
          - image: goa-main-api
            context: ./backend
            file: ./backend/Dockerfile
            target: main-api
          - image: goa-main-consumer
            context: ./backend
            file: ./backend/Dockerfile
            target: main-consumer
          - image: goa-main-publisher
            context: ./backend
            file: ./backend/Dockerfile
            target: main-publisher
          - image: goa-user-api
            context: ./backend
            file: ./backend/Dockerfile
            target: user-api
          - image: goa-user-consumer
            context: ./backend
            file: ./backend/Dockerfile
            target: user-consumer

          # --- Frontend (frontend/tennis-league/Dockerfile) ---
          - image: goa-web-client
            context: ./frontend/tennis-league
            file: ./frontend/tennis-league/Dockerfile
            build-args: BUILD_MODE=build
          - image: goa-web-client-staging
            context: ./frontend/tennis-league
            file: ./frontend/tennis-league/Dockerfile
            build-args: BUILD_MODE=build:staging

          # --- DB migration (infra/development/migrations/Dockerfile) ---
          - image: goa-migrate
            context: ./infra/development/migrations
            file: ./infra/development/migrations/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ghcr.io image isimleri küçük harf olmalı
      - name: Image adını hazırla
        id: name
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=${REGISTRY}/${owner}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata (tag'ler)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: ghcr.io'ya giriş
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build-args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # --- AUTO DEPLOY ---
  # SSH bilgileri geldiğinde burada etkinleştirilecek.
